<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111018">
  <title>MAG_TUMAN_MAG AI</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="wrap">
    <header><div class="mark">MAG</div><div><h1>MAG_TUMAN_MAG AI</h1><p>Твоя AI-студия</p></div></header>
    <section class="panel">
      <h2>Создать изображение</h2>
      <p class="muted">Опиши, что хочешь увидеть.</p>
      <textarea id="prompt" placeholder="Например: футуристический город в тумане, кинематографичный свет..."></textarea>
      <button id="imageBtn">Создать изображение</button>
      <div id="status" class="status" aria-live="polite"></div>
      <img id="result" alt="Созданное изображение" hidden>
    </section>
    <section class="panel">
      <h2>Создать видео</h2>
      <p class="muted">Раздел подготовлен. Для генерации видео нужно подключить отдельный видеосервис.</p>
      <button class="secondary" id="videoBtn">Проверить готовность видео</button>
      <div id="videoStatus" class="status" aria-live="polite"></div>
    </section>
    <footer>MAG_TUMAN_MAG AI · Telegram Mini App</footer>
  </main>
  <script src="/app.js"></script>
</body>
</html>
